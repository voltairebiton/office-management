name: Continuous integration

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: office_test
          POSTGRES_USER: office_test
          POSTGRES_PASSWORD: test_only_password
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U office_test -d office_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql://office_test:test_only_password@localhost:${{ job.services.postgres.ports[5432] }}/office_test
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply migrations to the isolated CI database
        run: npm run db:migrate:test
      - name: Run unit tests
        run: npm test
      - name: Run database integration tests
        run: npm run test:db
      - name: Run lint
        run: npm run lint
      - name: Build production application
        run: npm run build
      - name: Install the Chromium test browser
        run: npx playwright install --with-deps chromium
      - name: Run browser acceptance tests
        run: npm run test:e2e
